[package]
name = "opensk"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
description = "OpenSK's CTAP2 (FIDO2) authenticator, as a library"
repository = "https://github.com/google/OpenSK"
readme = "README.md"
keywords = ["fido2", "ctap2", "webauthn", "authenticator", "no_std"]
categories = ["authentication", "cryptography", "embedded", "no-std"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
sk-cbor = { path = "../cbor", version = "0.2.0" }
byteorder = { version = "1", default-features = false }
arrayref = "0.3.6"
subtle = { version = "2.2", default-features = false, features = ["nightly"] }
arbitrary = { version = "0.4.7", features = ["derive"], optional = true }
ed25519-compact = { version = "1", default-features = false, optional = true }
fn-dsa = { path = "../fn-dsa/fn-dsa", default-features = false, optional = true }
ml-dsa = { version = "0.1.1", default-features = false, optional = true }
shake = { version = "0.1", default-features = false, optional = true }
rand_core = "0.6.4"
rand = { version = "0.8.6", default-features = false, optional = true }
sha2 = { version = "0.10.6", default-features = false, optional = true }
hmac = { version = "0.12.1", default-features = false, optional = true }
hkdf = { version = "0.12.3", default-features = false, optional = true }
aes = { version = "0.8.2", default-features = false }
cbc = { version = "0.1.2", default-features = false }
crypto-bigint = { version = "0.5.5", default-features = false, optional = true }
zeroize = { version = "1.5.7", features = ["derive"] }
wasefire-store = { version = "0.2.4", optional = true }

[dependencies.p256]
version = "0.13.0"
default-features = false
features = ["alloc", "ecdh", "ecdsa"]
optional = true

[dependencies.p384]
version = "0.13.0"
default-features = false
features = ["alloc", "ecdsa"]
optional = true

[dependencies.p521]
version = "0.13.0"
default-features = false
features = ["alloc", "ecdsa"]
optional = true

[dependencies.k256]
version = "0.13.0"
default-features = false
features = ["alloc", "ecdsa"]
optional = true

[features]
default = ["config_command", "ctap1", "ed25519", "ed448", "es384", "es512", "es256k", "mldsa", "pq_composite", "rs256"]
config_command = []
debug_ctap = []
suppress_crypto_bytes = []
std = ["wasefire-store/std", "rand?/std_rng", "config_command", "software_crypto", "ed25519", "ed25519-compact", "ed448", "es384", "es512", "es256k", "mldsa", "pq_composite", "rs256", "fndsa"]
ctap1 = []
vendor_hid = []
fuzz = ["arbitrary", "std"]
software_crypto = ["rand", "sha2", "hmac", "hkdf", "p256"]
ed25519 = []
software_crypto_ed25519 = ["software_crypto", "ed25519", "ed25519-compact"]
ed448 = ["dep:shake"]
es384 = ["dep:p384"]
es512 = ["dep:p521", "sha2"]
es256k = ["dep:k256", "sha2"]
mldsa = ["dep:ml-dsa"]
pq_composite = ["mldsa", "es384", "ed25519", "ed448", "sha2"]
rs256 = ["dep:crypto-bigint", "sha2"]
fndsa = ["dep:fn-dsa"]
fingerprint = []
no_reset_restrictions = []
up_always_true = []

[dev-dependencies]
enum-iterator = "0.6.0"

[patch.crates-io]
ml-dsa = { path = "../ml-dsa" }

